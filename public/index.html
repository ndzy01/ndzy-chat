<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDZY Chat - OpenAI Messages API</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 900px;
        width: 100%;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .content {
        padding: 30px;
      }

      .section {
        margin-bottom: 30px;
      }

      .section h2 {
        font-size: 16px;
        color: #333;
        margin-bottom: 15px;
        font-weight: 600;
      }

      .messages-container {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
        min-height: 300px;
        max-height: 400px;
        overflow-y: auto;
        margin-bottom: 15px;
      }

      .message {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 6px;
        word-wrap: break-word;
      }

      .message.user {
        background: #667eea;
        color: white;
        margin-left: 40px;
        text-align: right;
      }

      .message.assistant {
        background: #e0e0e0;
        color: #333;
        margin-right: 40px;
      }

      .message.system {
        background: #fff3cd;
        color: #333;
        border-left: 3px solid #ffc107;
      }

      .message-role {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      .input-group select,
      .input-group textarea {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: inherit;
        font-size: 14px;
      }

      .input-group select {
        flex: 0 0 100px;
      }

      .input-group textarea {
        resize: none;
        height: 80px;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        flex: 1;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }

      .btn-secondary:hover {
        background: #e0e0e0;
      }

      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #f0f0f0;
        border-top: 2px solid #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .status {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .status.info {
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 NDZY Chat</h1>
        <p>OpenAI Messages API Test Interface</p>
      </div>

      <div class="content">
        <!-- Status -->
        <div id="status"></div>

        <!-- Messages Display -->
        <div class="section">
          <h2>Chat Messages</h2>
          <div class="messages-container" id="messagesContainer"></div>
        </div>

        <!-- Input -->
        <div class="section">
          <h2>Send Message</h2>
          <div class="input-group">
            <select id="roleSelect">
              <option value="user">User</option>
              <option value="assistant">Assistant</option>
              <option value="system">System</option>
            </select>
            <textarea
              id="messageInput"
              placeholder="Enter your message here..."
            ></textarea>
          </div>

          <div class="button-group">
            <button class="btn-primary" onclick="addMessage()">
              Add Message
            </button>
            <button class="btn-secondary" onclick="clearMessages()">
              Clear All
            </button>
          </div>

          <button class="btn-primary" onclick="sendChat()">
            <span id="sendButtonText">Send to Chat</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      let messages = [];

      // Display status message
      function showStatus(message, type = 'info') {
        const statusEl = document.getElementById('status');
        statusEl.className = `status ${type}`;
        statusEl.textContent = message;
      }

      // Add message to the list
      function addMessage() {
        const role = document.getElementById('roleSelect').value;
        const content = document.getElementById('messageInput').value.trim();

        if (!content) {
          showStatus('Please enter a message', 'error');
          return;
        }

        messages.push({ role, content });
        document.getElementById('messageInput').value = '';
        renderMessages();
        showStatus(`Message added as ${role}`, 'success');
      }

      // Render messages
      function renderMessages() {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = messages
          .map(
            (msg, index) => `
          <div class="message ${msg.role}">
            <div class="message-role">${msg.role}</div>
            <div>${escapeHtml(msg.content)}</div>
            <button onclick="deleteMessage(${index})" style="margin-top: 8px; padding: 4px 8px; font-size: 12px; background: rgba(0,0,0,0.1); color: inherit; border-radius: 4px; cursor: pointer;">Delete</button>
          </div>
        `
          )
          .join('');
      }

      // Delete message
      function deleteMessage(index) {
        messages.splice(index, 1);
        renderMessages();
      }

      // Clear all messages
      function clearMessages() {
        if (confirm('Are you sure you want to clear all messages?')) {
          messages = [];
          renderMessages();
          showStatus('All messages cleared', 'success');
        }
      }

      // Escape HTML
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Send chat request
      async function sendChat() {
        if (messages.length === 0) {
          showStatus('Please add at least one message', 'error');
          return;
        }

        const sendButton = event.target;
        sendButton.disabled = true;
        sendButton.innerHTML =
          '<span class="loading"></span> Sending...';

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ messages }),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.text();
          messages.push({ role: 'assistant', content: result });
          renderMessages();
          showStatus('Response received successfully!', 'success');
        } catch (error) {
          showStatus(`Error: ${error.message}`, 'error');
          console.error('Error:', error);
        } finally {
          sendButton.disabled = false;
          sendButton.innerHTML = 'Send to Chat';
        }
      }

      // Initialize with example message
      window.addEventListener('load', () => {
        messages = [
          {
            role: 'user',
            content: 'Hello, how are you today?',
          },
        ];
        renderMessages();
        showStatus('Ready to send messages!', 'info');
      });

      // Allow Enter key to send message (when in textarea)
      document.getElementById('messageInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && e.ctrlKey) {
          addMessage();
        }
      });
    </script>
  </body>
</html>
