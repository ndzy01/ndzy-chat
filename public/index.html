<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDZY Chat - OpenAI Messages API</title>
    <!-- Ant Design CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/antd@5.12.0/dist/reset.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/antd@5.12.0/dist/antd.min.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      #root {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .chat-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 900px;
        width: 100%;
      }

      .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
        border-radius: 12px 12px 0 0;
      }

      .chat-header h1 {
        font-size: 28px;
        margin: 0 0 8px 0;
      }

      .chat-header p {
        font-size: 14px;
        opacity: 0.9;
        margin: 0;
      }

      .chat-content {
        padding: 30px;
      }

      .messages-list {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
        min-height: 300px;
        max-height: 400px;
        overflow-y: auto;
        margin-bottom: 20px;
      }

      .message-item {
        margin-bottom: 12px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .message-item.user {
        justify-content: flex-end;
      }

      .message-bubble {
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 6px;
        word-wrap: break-word;
      }

      .message-bubble.user {
        background: #667eea;
        color: white;
      }

      .message-bubble.assistant {
        background: #e0e0e0;
        color: #333;
      }

      .message-bubble.system {
        background: #fff3cd;
        color: #333;
        border-left: 3px solid #ffc107;
      }

      .message-header {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Ant Design -->
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.0/dist/antd.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const {
        Layout,
        Form,
        Input,
        Button,
        Select,
        Space,
        Spin,
        message,
        Divider,
        Tag,
      } = antd;

      function ChatApp() {
        const [messages, setMessages] = useState([
          {
            role: 'user',
            content: 'Hello, how are you today?',
          },
        ]);
        const [loading, setLoading] = useState(false);
        const [messageInput, setMessageInput] = useState('');
        const [selectedRole, setSelectedRole] = useState('user');
        const messagesContainerRef = useRef(null);

        // Auto scroll to bottom
        useEffect(() => {
          if (messagesContainerRef.current) {
            messagesContainerRef.current.scrollTop =
              messagesContainerRef.current.scrollHeight;
          }
        }, [messages]);

        // Add message
        const handleAddMessage = () => {
          if (!messageInput.trim()) {
            message.error('Please enter a message');
            return;
          }

          setMessages([
            ...messages,
            {
              role: selectedRole,
              content: messageInput,
            },
          ]);
          setMessageInput('');
          message.success(`Message added as ${selectedRole}`);
        };

        // Delete message
        const handleDeleteMessage = (index) => {
          const newMessages = messages.filter((_, i) => i !== index);
          setMessages(newMessages);
          message.info('Message deleted');
        };

        // Clear all messages
        const handleClearMessages = () => {
          if (window.confirm('Are you sure you want to clear all messages?')) {
            setMessages([]);
            message.success('All messages cleared');
          }
        };

        // Send chat request
        const handleSendChat = async () => {
          if (messages.length === 0) {
            message.error('Please add at least one message');
            return;
          }

          setLoading(true);
          try {
            const response = await fetch('/chat', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ messages }),
            });

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.text();
            setMessages([
              ...messages,
              {
                role: 'assistant',
                content: result,
              },
            ]);
            message.success('Response received successfully!');
          } catch (error) {
            message.error(`Error: ${error.message}`);
            console.error('Error:', error);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="chat-container">
            <div className="chat-header">
              <h1>🤖 NDZY Chat</h1>
              <p>OpenAI Messages API Test Interface</p>
            </div>

            <div className="chat-content">
              {/* Messages Display */}
              <div>
                <h3>Chat Messages</h3>
                <div className="messages-list" ref={messagesContainerRef}>
                  {messages.map((msg, index) => (
                    <div key={index} className={`message-item ${msg.role}`}>
                      <div
                        style={{
                          display: 'flex',
                          flexDirection: 'column',
                          alignItems:
                            msg.role === 'user' ? 'flex-end' : 'flex-start',
                          width: '100%',
                        }}
                      >
                        <div
                          className={`message-bubble ${msg.role}`}
                          style={{
                            display: 'flex',
                            flexDirection: 'column',
                            gap: '8px',
                          }}
                        >
                          <div className="message-header">
                            <Tag color={msg.role === 'user' ? 'blue' : msg.role === 'assistant' ? 'green' : 'orange'}>
                              {msg.role}
                            </Tag>
                          </div>
                          <div
                            style={{
                              whiteSpace: 'pre-wrap',
                              wordBreak: 'break-word',
                            }}
                          >
                            {msg.content}
                          </div>
                          <Button
                            type="text"
                            size="small"
                            danger
                            onClick={() => handleDeleteMessage(index)}
                            style={{
                              alignSelf:
                                msg.role === 'user' ? 'flex-end' : 'flex-start',
                              fontSize: '12px',
                              padding: '4px 8px',
                            }}
                          >
                            Delete
                          </Button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <Divider />

              {/* Input Section */}
              <div>
                <h3>Send Message</h3>
                <Space direction="vertical" style={{ width: '100%' }}>
                  <div
                    style={{
                      display: 'flex',
                      gap: '10px',
                    }}
                  >
                    <Select
                      value={selectedRole}
                      onChange={setSelectedRole}
                      style={{ width: '120px' }}
                      options={[
                        { label: 'User', value: 'user' },
                        { label: 'Assistant', value: 'assistant' },
                        { label: 'System', value: 'system' },
                      ]}
                    />
                    <Input.TextArea
                      rows={4}
                      value={messageInput}
                      onChange={(e) => setMessageInput(e.target.value)}
                      placeholder="Enter your message here..."
                      onPressEnter={(e) => {
                        if (e.ctrlKey || e.metaKey) {
                          handleAddMessage();
                        }
                      }}
                    />
                  </div>

                  <Space style={{ width: '100%' }}>
                    <Button type="primary" onClick={handleAddMessage}>
                      Add Message
                    </Button>
                    <Button onClick={handleClearMessages}>Clear All</Button>
                  </Space>

                  <Button
                    type="primary"
                    block
                    size="large"
                    onClick={handleSendChat}
                    loading={loading}
                    disabled={messages.length === 0}
                  >
                    {loading ? 'Sending...' : 'Send to Chat'}
                  </Button>
                </Space>
              </div>
            </div>
          </div>
        );
      }

      // Render the app
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ChatApp />);
    </script>
  </body>
</html>
