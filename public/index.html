<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDZY Chat - OpenAI Messages API</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #root {
        width: 100%;
        max-width: 900px;
      }

      .chat-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .chat-header h1 {
        font-size: 28px;
        margin: 0 0 8px 0;
      }

      .chat-header p {
        font-size: 14px;
        opacity: 0.9;
        margin: 0;
      }

      .messages-container {
        background: #f5f5f5;
        border-radius: 8px;
        padding: 15px;
        min-height: 300px;
        max-height: 400px;
        overflow-y: auto;
        margin-bottom: 20px;
      }

      .message-item {
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
      }

      .message-item.user {
        justify-content: flex-end;
      }

      .message-bubble {
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 6px;
        word-wrap: break-word;
      }

      .message-bubble.user {
        background: #667eea;
        color: white;
      }

      .message-bubble.assistant {
        background: #e0e0e0;
        color: #333;
      }

      .message-bubble.system {
        background: #fff3cd;
        color: #333;
        border-left: 3px solid #ffc107;
      }

      .message-role-badge {
        font-size: 11px;
        margin-bottom: 4px;
      }

      .delete-btn {
        align-self: flex-end;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function ChatApp() {
        const [messages, setMessages] = useState([
          {
            role: 'user',
            content: 'Hello, how are you today?',
          },
        ]);
        const [loading, setLoading] = useState(false);
        const [messageInput, setMessageInput] = useState('');
        const [selectedRole, setSelectedRole] = useState('user');
        const messagesContainerRef = useRef(null);

        // Auto scroll to bottom
        useEffect(() => {
          if (messagesContainerRef.current) {
            messagesContainerRef.current.scrollTop =
              messagesContainerRef.current.scrollHeight;
          }
        }, [messages]);

        // Show toast notification
        const showToast = (message, type = 'info') => {
          const alertDiv = document.createElement('div');
          alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
          alertDiv.style.cssText =
            'top: 20px; right: 20px; z-index: 9999; max-width: 400px;';
          alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          `;
          document.body.appendChild(alertDiv);

          setTimeout(() => {
            alertDiv.remove();
          }, 3000);
        };

        // Add message
        const handleAddMessage = () => {
          if (!messageInput.trim()) {
            showToast('Please enter a message', 'danger');
            return;
          }

          setMessages([
            ...messages,
            {
              role: selectedRole,
              content: messageInput,
            },
          ]);
          setMessageInput('');
          showToast(`Message added as ${selectedRole}`, 'success');
        };

        // Delete message
        const handleDeleteMessage = (index) => {
          const newMessages = messages.filter((_, i) => i !== index);
          setMessages(newMessages);
          showToast('Message deleted', 'info');
        };

        // Clear all messages
        const handleClearMessages = () => {
          if (window.confirm('Are you sure you want to clear all messages?')) {
            setMessages([]);
            showToast('All messages cleared', 'success');
          }
        };

        // Send chat request
        const handleSendChat = async () => {
          if (messages.length === 0) {
            showToast('Please add at least one message', 'danger');
            return;
          }

          setLoading(true);
          try {
            const response = await fetch('/chat', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ messages }),
            });

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.text();
            setMessages((prev) => [
              ...prev,
              {
                role: 'assistant',
                content: result,
              },
            ]);
            showToast('Response received successfully!', 'success');
          } catch (error) {
            showToast(`Error: ${error.message}`, 'danger');
            console.error('Error:', error);
          } finally {
            setLoading(false);
          }
        };

        const getRoleBadgeColor = (role) => {
          switch (role) {
            case 'user':
              return 'primary';
            case 'assistant':
              return 'success';
            case 'system':
              return 'warning';
            default:
              return 'secondary';
          }
        };

        return (
          <div className="chat-container">
            <div className="chat-header">
              <h1>🤖 NDZY Chat</h1>
              <p>OpenAI Messages API Test Interface</p>
            </div>

            <div className="p-4">
              {/* Messages Display */}
              <div className="mb-4">
                <h5 className="mb-3">Chat Messages</h5>
                <div className="messages-container" ref={messagesContainerRef}>
                  {messages.length === 0 ? (
                    <div className="text-center text-muted py-5">
                      No messages yet. Add one to get started!
                    </div>
                  ) : (
                    messages.map((msg, index) => (
                      <div
                        key={index}
                        className={`message-item ${msg.role}`}
                      >
                        <div style={{ width: '100%' }}>
                          <div className={`message-bubble ${msg.role}`}>
                            <div className="message-role-badge">
                              <span
                                className={`badge bg-${getRoleBadgeColor(msg.role)}`}
                              >
                                {msg.role}
                              </span>
                            </div>
                            <div
                              style={{
                                whiteSpace: 'pre-wrap',
                                wordBreak: 'break-word',
                                marginBottom: '8px',
                              }}
                            >
                              {msg.content}
                            </div>
                            <button
                              className="btn btn-sm btn-outline-danger delete-btn"
                              onClick={() => handleDeleteMessage(index)}
                            >
                              Delete
                            </button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <hr />

              {/* Input Section */}
              <div className="mb-4">
                <h5 className="mb-3">Send Message</h5>

                <div className="input-group mb-3">
                  <select
                    className="form-select"
                    style={{ maxWidth: '120px' }}
                    value={selectedRole}
                    onChange={(e) => setSelectedRole(e.target.value)}
                  >
                    <option value="user">User</option>
                    <option value="assistant">Assistant</option>
                    <option value="system">System</option>
                  </select>

                  <textarea
                    className="form-control"
                    rows="4"
                    value={messageInput}
                    onChange={(e) => setMessageInput(e.target.value)}
                    placeholder="Enter your message here..."
                    disabled={loading}
                  ></textarea>
                </div>

                <div className="d-flex gap-2 mb-3">
                  <button
                    className="btn btn-primary"
                    onClick={handleAddMessage}
                    disabled={loading}
                  >
                    Add Message
                  </button>
                  <button
                    className="btn btn-outline-secondary"
                    onClick={handleClearMessages}
                    disabled={loading}
                  >
                    Clear All
                  </button>
                </div>

                <button
                  className="btn btn-primary w-100"
                  onClick={handleSendChat}
                  disabled={loading || messages.length === 0}
                >
                  {loading ? (
                    <>
                      <span
                        className="spinner-border spinner-border-sm me-2"
                        role="status"
                        aria-hidden="true"
                      ></span>
                      Sending...
                    </>
                  ) : (
                    'Send to Chat'
                  )}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Render the app
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ChatApp />);
    </script>
  </body>
</html>
