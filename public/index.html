<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NDZY Chat - OpenAI Messages API</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />

    <!-- 独立样式文件 -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div id="root"></div>

    <!-- ============ 本地依赖库 ============ -->
    <!-- React -->
    <script crossorigin src="/vendor/react.production.min.js"></script>
    <script crossorigin src="/vendor/react-dom.production.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="/vendor/bootstrap.bundle.min.js"></script>

    <!-- Markdown 渲染 -->
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>

    <!-- Babel standalone（编译 JSX） -->
    <script src="/vendor/babel.min.js"></script>

    <!-- ============ 工具函数 ============ -->
    <script src="/js/utils/helpers.js"></script>

    <!-- ============ API 服务层 ============ -->
    <script src="/js/services/chatApi.js"></script>
    <script src="/js/services/taskApi.js"></script>

    <!-- ============ React 组件 ============ -->
    <script type="text/babel" src="/js/components/MessageBubble.jsx"></script>
    <script type="text/babel" src="/js/components/ChatApp.jsx"></script>
    <script type="text/babel" src="/js/components/TaskBoard.jsx"></script>

    <!-- ============ 应用入口 ============ -->
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<TaskBoard />);
